# Local stack: AutoSleep + Postgres + Redis. `docker compose up`, then open
# http://localhost:8080 and log in as autosleep / autosleep-dev.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autosleep_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  autosleep:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/autosleep_dev?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      PASSPHRASE: "local-dev-passphrase-change-me"
      API_USER: "autosleep"
      API_PASS: "autosleep-dev"
      GIN_MODE: "debug"
      PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
