name: Feature request
description: Suggest a new capability or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check [ROADMAP.md](../ROADMAP.md) — it may already be planned.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user-facing problem, not the solution. What are you trying to do that AutoSleep doesn't support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you want it to work? API shape, UI sketch, config surface — whatever you have.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you dropped them.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, prior art, screenshots, etc.
